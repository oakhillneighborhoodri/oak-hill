# The site's HTML is generated by build.js from the JSON in /data.
# Decap commits to those JSON files, so Netlify has to re-run the generator on
# every deploy ~ without this, a CMS edit changes the data and the live pages
# keep showing the old content.

[build]
  command = "node build.js"
  publish = "."

[build.environment]
  NODE_VERSION = "22"
